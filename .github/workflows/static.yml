
name: Deploy OpenSA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      
      - name: Check repository files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Root files ==="
          ls -la
          echo "=== Tracked lockfiles ==="
          git ls-files '*package-lock.json' '*npm-shrinkwrap.json'
          echo "=== Lockfile check ==="
          if [ -f package-lock.json ]; then
            echo "ROOT package-lock.json FOUND"
            head -n 5 package-lock.json
          else
            echo "ROOT package-lock.json NOT FOUND"
          fi
          npm --version
          npm config get package-lock

      - name: Install dependencies
        run: npm install --include=dev --workspaces --ignore-scripts
        

      - name: Build
        run: npm run build -- --base=/opensa-chromebook/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
